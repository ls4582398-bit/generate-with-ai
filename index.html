<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generate with AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#090914;color:white;font-family:Arial,sans-serif}
header{padding:22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #25253b}
.logo{font-size:23px;font-weight:bold;background:linear-gradient(90deg,#9b5cff,#35c9ff);-webkit-background-clip:text;color:transparent}
.plan{background:#25203d;padding:9px 14px;border-radius:20px;color:#c8aaff}
.container{padding:22px;max-width:650px;margin:auto}
h1{font-size:30px;margin-top:20px;margin-bottom:12px}
.subtitle{color:#aaaabe;margin-bottom:28px;line-height:1.5}
.tabs{display:flex;gap:12px;margin-bottom:20px}
.tab{flex:1;padding:14px;border:1px solid #39334e;background:#171728;color:white;border-radius:12px;font-size:15px}
.tab.active{background:linear-gradient(100deg,#713bdf,#287bdc);border:none}
label{display:block;margin:18px 0 10px;color:#ddd}
textarea{width:100%;height:125px;background:#171728;border:1px solid #39334e;border-radius:13px;padding:15px;color:white;font-size:15px;resize:vertical}
select,input[type=file]{width:100%;padding:14px;background:#171728;color:white;border:1px solid #39334e;border-radius:12px}
button{cursor:pointer}
.generate{width:100%;margin-top:24px;padding:17px;border:none;border-radius:13px;color:white;font-size:17px;font-weight:bold;background:linear-gradient(100deg,#833cf0,#287be8)}
.preview{margin-top:25px;padding:18px;background:#171728;border:1px solid #39334e;border-radius:15px;text-align:center;min-height:100px}
.preview img{max-width:100%;border-radius:12px;margin-top:12px}
.gallery{margin-top:35px}
.gallery h2{margin-bottom:15px}
.gallery p{color:#999;padding:20px;background:#171728;border-radius:12px;text-align:center}
footer{text-align:center;color:#777;padding:30px 10px}
</style>
</head>
<body>
<header>
  <div class="logo">✦ Generate AI</div>
  <div class="plan">₹10 / Day</div>
</header>
<div class="container">
<h1>Create Anything with AI ✨</h1>
<p class="subtitle">Turn your imagination into amazing images and videos. Create something extraordinary!</p>
<div class="tabs">
  <button class="tab active" onclick="setMode('image',this)">🖼 Image</button>
  <button class="tab" onclick="setMode('video',this)">🎬 Video</button>
</div>
<label for="prompt">Describe your imagination</label>
<textarea id="prompt" placeholder="Describe what you want to create..."></textarea>
<label for="style">Choose Creative Style</label>
<select id="style">
  <option>Realistic</option><option>Anime</option><option>3D Art</option>
  <option>Cinematic</option><option>Fantasy</option><option>Digital Art</option>
</select>
<label for="photo">Upload a Photo (Optional)</label>
<input type="file" id="photo" accept="image/*">
<button class="generate" onclick="generate()">✦ Generate with AI</button>
<div class="preview" id="preview">Your creations will appear here.</div>
<div class="gallery"><h2>My Creations 🎨</h2><p>Your creative gallery is waiting!</p></div>
</div>
<footer>Made with ✦ Generate with AI</footer>
<script>
let mode = "image";
function setMode(type, button) {
  mode = type;
  document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  button.classList.add("active");
}
function generate() {
  const prompt = document.getElementById("prompt").value;
  const preview = document.getElementById("preview");
  if (!prompt.trim()) { alert("Please describe your imagination first!"); return; }
  preview.innerHTML =
    "<h3>✨ Your idea is ready!</h3>" +
    "<p style='margin-top:12px;color:#aaa'>" +
    "Mode: " + mode.toUpperCase() +
    "<br>Style: " + document.getElementById("style").value +
    "<br><br>AI generation API connection is required to create your " +
    mode + ".</p>";
}
</script>
</body>
</html>
